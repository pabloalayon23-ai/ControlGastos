name: Run recovery patch v1.8.23
permissions:
  contents: write
on:
  push:
    paths:
      - '.github/workflows/run-patch-recovery-v1823.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply recovery patch
        run: python scripts/patch_recovery_v1823.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/pablo/controlgastos/ExpenseDb.java app/src/main/java/com/pablo/controlgastos/DetectionRules.java app/src/main/java/com/pablo/controlgastos/MainActivity.java app/src/main/java/com/pablo/controlgastos/HomeActivity.java app/build.gradle
          git commit -m "Add recycle bin and undo history"
          git push
