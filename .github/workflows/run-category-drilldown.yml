name: Run analytics v1.8.30 patch
permissions:
  contents: write
on:
  push:
    paths:
      - 'scripts/patch_analytics_v1830.py'
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply analytics patch
        run: python3 scripts/patch_analytics_v1830.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/pablo/controlgastos/AnalyticsActivity.java app/build.gradle
          git commit -m "Improve analytics navigation balance merchants and scale v1.8.30"
          git push
