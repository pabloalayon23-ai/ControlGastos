name: Run category drilldown patch
permissions:
  contents: write
on:
  push:
    paths:
      - '.github/workflows/run-category-drilldown.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('.github/workflows/patch-category-drilldown.yml').read_text()
          a=s.index('          from pathlib')
          b=s.index('      - name: Commit changes')
          code='\n'.join(line[10:] if line.startswith('          ') else line for line in s[a:b].splitlines())
          exec(code)
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/pablo/controlgastos/DetectionRules.java app/src/main/java/com/pablo/controlgastos/HomeActivity.java app/src/main/java/com/pablo/controlgastos/AnalyticsActivity.java app/build.gradle
          git commit -m "Add category drilldown and learn category changes"
          git push
