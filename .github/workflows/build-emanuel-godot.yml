name: Build Emanuel Godot APK

on:
  push:
    branches: [ emanuel-runner ]
    paths:
      - 'emanuel-game/project.godot'
      - 'emanuel-game/export_presets.cfg'
      - 'emanuel-game/godot/**'
      - 'emanuel-game/app/src/main/res/raw/atlas*.txt'
      - '.github/workflows/build-emanuel-godot.yml'
  workflow_dispatch:

jobs:
  export_android:
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.3
    permissions:
      contents: read
    env:
      GODOT_VERSION: '4.3'
      PROJECT_PATH: emanuel-game
      GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /github/home/.android/debug.keystore
      GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
      GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Godot CI environment
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --sdk_root=/usr/lib/android-sdk "platform-tools" "build-tools;34.0.0" "platforms;android-34"
          mkdir -p ~/.local/share/godot/export_templates ~/.config/godot ~/.android
          if [ -d /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ]; then
            rm -rf ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
            cp -a /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/
          fi
          if [ -f /root/.config/godot/editor_settings-4.3.tres ]; then
            cp /root/.config/godot/editor_settings-4.3.tres ~/.config/godot/editor_settings-4.3.tres
          else
            touch ~/.config/godot/editor_settings-4.3.tres
          fi
          printf '\nexport/android/java_sdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"\nexport/android/android_sdk_path = "/usr/lib/android-sdk"\n' >> ~/.config/godot/editor_settings-4.3.tres
          keytool -genkeypair -v -keystore "$GODOT_ANDROID_KEYSTORE_DEBUG_PATH" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          keytool -list -keystore "$GODOT_ANDROID_KEYSTORE_DEBUG_PATH" -storepass android -alias androiddebugkey >/dev/null
          ls -lah ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

      - name: Fix Godot script typing
        run: |
          sed -i 's/var cy := c.y + sin(c.phase)\*10.0/var cy: float = float(c.y) + sin(float(c.phase))*10.0/g' emanuel-game/godot/main.gd
          sed -i 's/var x := wx-fmod(world_x\*0.13,1420.0)/var x: float = float(wx)-fmod(world_x*0.13,1420.0)/g' emanuel-game/godot/main.gd
          sed -i 's/var cy := c.y+sin(c.phase)\*10.0/var cy: float = float(c.y)+sin(float(c.phase))*10.0/g' emanuel-game/godot/main.gd

      - name: Import project
        run: |
          cd "$PROJECT_PATH"
          godot --headless --editor --quit

      - name: Export Android APK
        run: |
          mkdir -p build/android
          EXPORT_DIR="$(readlink -f build/android)"
          cd "$PROJECT_PATH"
          godot --headless --verbose --export-debug "Android" "$EXPORT_DIR/Emanuel-Aventuras-Godot-v1.apk"

      - name: Verify APK
        run: |
          APK=build/android/Emanuel-Aventuras-Godot-v1.apk
          test -f "$APK"
          APKSIGNER="$(find /usr/lib/android-sdk/build-tools -type f -name apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Emanuel-Aventuras-Godot-v1
          path: build/android/Emanuel-Aventuras-Godot-v1.apk
          if-no-files-found: error
