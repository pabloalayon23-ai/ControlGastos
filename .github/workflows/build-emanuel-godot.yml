name: Build Emanuel Godot APK

on:
  push:
    branches: [ emanuel-runner ]
    paths:
      - 'emanuel-game/project.godot'
      - 'emanuel-game/export_presets.cfg'
      - 'emanuel-game/godot/**'
      - 'emanuel-game/app/src/main/res/raw/atlas*.txt'
      - '.github/workflows/build-emanuel-godot.yml'
  workflow_dispatch:

jobs:
  export_android:
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.3
    permissions:
      contents: read
    env:
      GODOT_VERSION: '4.3'
      PROJECT_PATH: emanuel-game
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Godot CI environment
        run: |
          mkdir -p ~/.local/share/godot/export_templates/
          mkdir -p ~/.config/
          if [ -d /root/.config/godot ]; then rm -rf ~/.config/godot; mv /root/.config/godot ~/.config/godot; fi
          if [ -d /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ]; then
            rm -rf ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
            mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          fi
          echo 'export/android/java_sdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"' >> ~/.config/godot/editor_settings-4.3.tres

      - name: Fix Godot script typing
        run: |
          sed -i 's/var cy := c.y + sin(c.phase)\*10.0/var cy: float = float(c.y) + sin(float(c.phase))*10.0/g' emanuel-game/godot/main.gd
          sed -i 's/var x := wx-fmod(world_x\*0.13,1420.0)/var x: float = float(wx)-fmod(world_x*0.13,1420.0)/g' emanuel-game/godot/main.gd
          sed -i 's/var cy := c.y+sin(c.phase)\*10.0/var cy: float = float(c.y)+sin(float(c.phase))*10.0/g' emanuel-game/godot/main.gd

      - name: Import project
        run: |
          cd "$PROJECT_PATH"
          godot --headless --verbose --editor --quit

      - name: Export Android debug APK
        run: |
          mkdir -p build/android
          EXPORT_DIR="$(readlink -f build/android)"
          cd "$PROJECT_PATH"
          godot --headless --verbose --export-debug "Android" "$EXPORT_DIR/Emanuel-Aventuras-Godot-v1.apk"

      - name: Verify APK
        run: |
          test -f build/android/Emanuel-Aventuras-Godot-v1.apk
          ls -lh build/android/Emanuel-Aventuras-Godot-v1.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Emanuel-Aventuras-Godot-v1
          path: build/android/Emanuel-Aventuras-Godot-v1.apk
          if-no-files-found: error
