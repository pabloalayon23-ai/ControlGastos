name: Build Emanuel Godot APK

on:
  push:
    branches: [ emanuel-runner ]
    paths:
      - 'emanuel-game/project.godot'
      - 'emanuel-game/export_presets.cfg'
      - 'emanuel-game/godot/**'
      - 'emanuel-game/app/src/main/res/raw/atlas*.txt'
      - '.github/workflows/build-emanuel-godot.yml'
  workflow_dispatch:

jobs:
  export_android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Godot 4.3 Android requirements
        run: |
          sdkmanager "platform-tools" "build-tools;34.0.0" "platforms;android-34" "cmdline-tools;latest" "cmake;3.10.2.4988404" "ndk;23.2.8568313"

      - name: Configure Godot Android paths
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

      - name: Fix Godot numeric type inference
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('emanuel-game/godot/main.gd')
          s=p.read_text()
          s=s.replace('var cy := c.y + sin(c.phase)*10.0','var cy: float = float(c.y) + sin(float(c.phase))*10.0')
          s=s.replace('var x := wx-fmod(world_x*0.13,1420.0)','var x: float = float(wx)-fmod(world_x*0.13,1420.0)')
          s=s.replace('var cy := c.y+sin(c.phase)*10.0','var cy: float = float(c.y)+sin(float(c.phase))*10.0')
          p.write_text(s)
          PY

      - name: Export unsigned Godot Android APK
        id: export
        uses: firebelley/godot-export@v8.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          relative_project_path: ./emanuel-game
          presets_to_export: Android
          export_debug: true
          use_preset_export_path: true
          cache: true

      - name: Sign exported APK
        run: |
          UNSIGNED=$(find emanuel-game "$HOME/.local/share/godot/builds" -type f -name '*.apk' 2>/dev/null | head -n 1)
          test -n "$UNSIGNED"
          mkdir -p "$HOME/.android" artifact
          keytool -genkeypair -v -keystore "$HOME/.android/emanuel-debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Emanuel Aventuras,C=UY"
          "$ANDROID_SDK_ROOT/build-tools/34.0.0/zipalign" -f 4 "$UNSIGNED" artifact/Emanuel-Aventuras-Godot-v1-aligned.apk
          "$ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner" sign --ks "$HOME/.android/emanuel-debug.keystore" --ks-key-alias androiddebugkey --ks-pass pass:android --key-pass pass:android --out artifact/Emanuel-Aventuras-Godot-v1.apk artifact/Emanuel-Aventuras-Godot-v1-aligned.apk
          "$ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner" verify --verbose artifact/Emanuel-Aventuras-Godot-v1.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Emanuel-Aventuras-Godot-v1
          path: artifact/Emanuel-Aventuras-Godot-v1.apk
          if-no-files-found: error
