name: Fix v1.8.26 help separator
permissions:
  contents: write
on:
  push:
    paths:
      - '.github/workflows/patch-help-search.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix Java help separator
        shell: python
        run: |
          from pathlib import Path
          p=Path('app/src/main/java/com/pablo/controlgastos/HomeActivity.java')
          s=p.read_text()
          bad='eBROU.",\\n   "PRIVACIDAD'
          good='eBROU.",'+chr(10)+'   "PRIVACIDAD'
          if bad not in s: raise SystemExit('separator not found')
          p.write_text(s.replace(bad,good,1))
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/com/pablo/controlgastos/HomeActivity.java
          git commit -m "Fix help separator v1.8.26"
          git push
