name: Patch category drilldown
permissions:
  contents: write
on:
  push:
    paths:
      - '.github/workflows/patch-category-drilldown.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch analytics, help and version
        shell: python
        run: |
          from pathlib import Path
          p=Path('app/src/main/java/com/pablo/controlgastos/AnalyticsActivity.java')
          s=p.read_text()
          old='if(cat)r.setOnClickListener(v->startActivity(new Intent(this,CategorySettingsActivity.class)));else r.setOnClickListener(v->showMerchantDetail(i.name));'
          new='if(cat)r.setOnClickListener(v->showCategoryDetail(i.name));else r.setOnClickListener(v->showMerchantDetail(i.name));'
          if old not in s: raise SystemExit('Analytics rank target not found')
          s=s.replace(old,new,1)
          marker=' private void showMerchantDetail(String merchant){'
          helper=r''' private void showCategoryDetail(String category){
  LinearLayout box=new LinearLayout(this);box.setOrientation(LinearLayout.VERTICAL);box.setPadding(dp(8),dp(4),dp(8),dp(8));ScrollView sc=new ScrollView(this);LinearLayout rows=new LinearLayout(this);rows.setOrientation(LinearLayout.VERTICAL);sc.addView(rows);box.addView(tv("Tocá un movimiento para cambiar su categoría. El cambio también actualiza la lista blanca para movimientos similares futuros.",13,MUTED));box.addView(sc,new LinearLayout.LayoutParams(-1,dp(430)));
  Calendar a=(Calendar)selected.clone();a.set(Calendar.DAY_OF_MONTH,1);a.set(Calendar.HOUR_OF_DAY,0);a.set(Calendar.MINUTE,0);a.set(Calendar.SECOND,0);a.set(Calendar.MILLISECOND,0);if(annual)a.set(Calendar.MONTH,Calendar.JANUARY);Calendar b=(Calendar)a.clone();b.add(annual?Calendar.YEAR:Calendar.MONTH,1);
  Cursor c=db.getReadableDatabase().rawQuery("SELECT id,amount,currency,category,description,ts FROM tx WHERE type='GASTO' AND ts>=? AND ts<? ORDER BY ts DESC,id DESC",new String[]{String.valueOf(a.getTimeInMillis()),String.valueOf(b.getTimeInMillis())});int count=0;SimpleDateFormat df=new SimpleDateFormat("dd/MM/yyyy",Locale.US);
  while(c.moveToNext()){long id=c.getLong(0);double amount=c.getDouble(1);String cur=c.getString(2),cat=c.getString(3),desc=c.getString(4);long ts=c.getLong(5);if(!category.equalsIgnoreCase(categoryKey(cat,desc)))continue;count++;LinearLayout row=new LinearLayout(this);row.setOrientation(LinearLayout.VERTICAL);row.setPadding(dp(10),dp(8),dp(10),dp(8));row.setBackground(bg(CARD,10));row.addView(tv((desc==null||desc.trim().isEmpty()?"Sin descripción":desc),15,TEXT));row.addView(tv(df.format(new Date(ts))+" · "+("USD".equals(cur)?"USD ":"$ ")+money.format(amount)+" · Categoría: "+(cat==null||cat.trim().isEmpty()?"Otros":cat),12,MUTED));LinearLayout.LayoutParams rp=new LinearLayout.LayoutParams(-1,-2);rp.setMargins(0,0,0,dp(6));rows.addView(row,rp);final long fid=id;final String fcat=cat;row.setOnClickListener(v->showMovementCategoryPicker(fid,fcat));}
  c.close();if(count==0)rows.addView(tv("No hay movimientos en esta categoría.",14,MUTED));new AlertDialog.Builder(this).setTitle(category+" · "+count+" movimientos").setView(box).setNegativeButton("Cerrar",null).show();
 }
 private void showMovementCategoryPicker(long id,String current){ArrayList<String> cats=new ArrayList<>(DetectionRules.categoryNames(this));if(current!=null&&!current.trim().isEmpty()&&!cats.contains(current.trim()))cats.add(0,current.trim());cats.add("＋ Nueva categoría…");String[] arr=cats.toArray(new String[0]);new AlertDialog.Builder(this).setTitle("Cambiar categoría").setItems(arr,(d,w)->{if(w==arr.length-1){EditText e=new EditText(this);e.setHint("Nueva categoría");new AlertDialog.Builder(this).setTitle("Nueva categoría").setView(e).setPositiveButton("Guardar",(x,y)->{String nc=e.getText().toString().trim();if(!nc.isEmpty()){DetectionRules.assignMovementCategory(this,id,nc);renderActive();Toast.makeText(this,"Categoría actualizada y regla guardada",Toast.LENGTH_SHORT).show();}}).setNegativeButton("Cancelar",null).show();}else{DetectionRules.assignMovementCategory(this,id,arr[w]);renderActive();Toast.makeText(this,"Categoría actualizada y regla guardada",Toast.LENGTH_SHORT).show();}}).setNegativeButton("Cancelar",null).show();}
'''
          if marker not in s: raise SystemExit('Analytics detail anchor not found')
          s=s.replace(marker,helper+marker,1)
          p.write_text(s)

          h=Path('app/src/main/java/com/pablo/controlgastos/HomeActivity.java')
          hs=h.read_text()
          oldhelp='   "14. GRÁFICOS\\nGráficos permite analizar Categorías, Comercios, Evolución y Comparar períodos. Usa las categorías y colores configurados en Ajustes.",'
          newhelp='   "14. GRÁFICOS\\nGráficos permite analizar Categorías, Comercios, Evolución y Comparar períodos. En Categorías, tocá una categoría para ver los movimientos que contiene y tocá un movimiento para cambiarlo de categoría. El cambio actualiza también la lista blanca para movimientos similares futuros. En Inicio, cada movimiento muestra su categoría y podés tocarla para cambiarla directamente.",'
          if oldhelp in hs: hs=hs.replace(oldhelp,newhelp,1)
          h.write_text(hs)

          g=Path('app/build.gradle')
          gs=g.read_text().replace('versionCode 41','versionCode 42').replace("versionName '1.8.19'","versionName '1.8.20'")
          if gs==g.read_text(): raise SystemExit('Version target not found')
          g.write_text(gs)
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/pablo/controlgastos/AnalyticsActivity.java app/src/main/java/com/pablo/controlgastos/HomeActivity.java app/build.gradle
          git commit -m "Add category drilldown and editable assignments"
          git push
