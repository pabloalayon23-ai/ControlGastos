            while(c.moveToNext()){
                String existing=c.getString(0);long existingTs=c.getLong(1);
                if(merchantMatches(description,existing))return true;
                if(isGenericBankDescription(existing))genericNearCount++;
            }
            return genericNearCount==1;
        }finally{c.close();}
