          marker=''' private static void showAnalysisHelp(Activity a){'''
          help_method=''' private static void showReconciliationHelp(Activity a){
  String t="CONCILIACIÓN DE MOVIMIENTOS\\n\\nControlGastos usa la misma regla tanto al importar eBROU como en Ajustes → Conciliar movimientos.\\n\\nPara considerar dos registros como el mismo movimiento exige: misma fecha calendario, importe exacto al centésimo, misma moneda, mismo tipo (gasto o ingreso) y una parte suficientemente parecida del nombre/comercio. Se ignoran diferencias como ‘Comercio:’, tildes, mayúsculas, símbolos, números de local o sucursal.\\n\\nEjemplo: ‘DISCO N° 23’ y ‘Comercio: DISCO N’ pueden conciliar si además coinciden fecha e importe.\\n\\nDurante la importación, una coincidencia clara se vincula al movimiento ya existente en vez de crear otro. Se procura conservar la categoría útil que ya tenía el registro.\\n\\nEl botón de Ajustes busca posibles duplicados ya guardados y los muestra uno por uno. Nada se unifica sin confirmación. La copia eliminada queda en la Papelera.";
  TextView tv=new TextView(a);tv.setText(t);tv.setTextSize(15);tv.setPadding(dp(a,24),dp(a,16),dp(a,24),dp(a,16));new AlertDialog.Builder(a).setTitle("Conciliación").setView(tv).setPositiveButton("Entendido",null).show();
 }

'''
