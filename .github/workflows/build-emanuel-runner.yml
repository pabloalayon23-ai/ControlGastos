name: Build Emanuel Runner APK

on:
  push:
    branches: [ emanuel-runner ]
    paths:
      - 'emanuel-game/**'
      - '.github/workflows/build-emanuel-runner.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: emanuel-game
        run: gradle assembleDebug --stacktrace

      - name: Rename APK
        run: cp emanuel-game/app/build/outputs/apk/debug/app-debug.apk Emanuel-Aventuras-v1.2.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Emanuel-Aventuras-v1.2.0
          path: Emanuel-Aventuras-v1.2.0.apk
          if-no-files-found: error
